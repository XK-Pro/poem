<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Chinese Poem</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }

  #loader {
    position: fixed; inset: 0;
    background: #000;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 999;
    transition: opacity 0.6s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }

  .loader-circle {
    width: 48px; height: 48px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: rgba(255,255,255,0.9);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text {
    margin-top: 18px; font-size: 0.95rem;
    letter-spacing: 0.3em; opacity: 0.5;
  }

  #main {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    width: 100%;
    opacity: 0; transform: translateY(12px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  #main.show { opacity: 1; transform: translateY(0); }

  #poem-content {
    font-size: 2.2rem; line-height: 1.6; letter-spacing: 0.05em;
    max-width: 90%; transition: opacity 0.35s ease;
  }
  #poem-content.fade { opacity: 0; }
  #poem-info {
    font-size: 1.1rem; margin-top: 24px; opacity: 0.7;
    transition: opacity 0.35s ease;
  }
  #poem-info.fade { opacity: 0; }

  #full-poem {
    max-height: 0; overflow: hidden;
    margin-top: 0; font-size: 1.05rem; line-height: 2;
    max-width: 90%; opacity: 0;
    transition: max-height 0.8s cubic-bezier(0.25, 0.8, 0.25, 1),
                opacity 0.8s ease, margin-top 0.8s ease;
  }
  #full-poem.show { max-height: 2000px; opacity: 0.8; margin-top: 24px; }

  .btn-row { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; justify-content: center; }
  .btn-row button {
    padding: 10px 22px;
    background: transparent; color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 24px; font-size: 0.95rem;
    font-family: inherit; cursor: pointer;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  .btn-row button:active { background: rgba(255,255,255,0.15); opacity: 0.7; }
  .btn-row button:disabled { opacity: 0.3; cursor: default; }

  #copy-toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(255,255,255,0.15);
    color: #fff; padding: 8px 20px;
    border-radius: 20px; font-size: 0.9rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    backdrop-filter: blur(8px);
  }
  #copy-toast.show {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-circle"></div>
  <div class="loader-text">诗</div>
</div>

<div id="main">
  <div id="poem-content">加载中...</div>
  <div id="poem-info"></div>
  <div id="full-poem"></div>
  <div class="btn-row">
    <button id="toggle-btn">显示全文</button>
    <button id="copy-btn">一键复制</button>
    <button id="refresh-btn">再来一首</button>
  </div>
</div>

<div id="copy-toast">已复制</div>

<script>
  const loaderEl = document.getElementById('loader');
  const mainEl = document.getElementById('main');
  const contentEl = document.getElementById('poem-content');
  const infoEl = document.getElementById('poem-info');
  const fullEl = document.getElementById('full-poem');
  const toggleBtn = document.getElementById('toggle-btn');
  const copyBtn = document.getElementById('copy-btn');
  const refreshBtn = document.getElementById('refresh-btn');
  const toastEl = document.getElementById('copy-toast');

  let fullLines = [];
  let firstLoad = true;
  let currentContent = '';
  let currentInfo = '';

  async function fetchPoem() {
    const res = await fetch('https://v1.jinrishici.com/all.json');
    const json = await res.json();
    return json;
  }

  function render(d) {
    currentContent = d.content;
    currentInfo = `${d.author}《${d.origin}》`;
    contentEl.innerText = currentContent;
    infoEl.innerText = currentInfo;

    fullLines = [];
    fullEl.innerHTML = '';
    fullEl.classList.remove('show');
    toggleBtn.style.display = 'none';

    requestAnimationFrame(() => {
      contentEl.classList.remove('fade');
      infoEl.classList.remove('fade');
    });

    if (firstLoad) {
      firstLoad = false;
      loaderEl.classList.add('hide');
      setTimeout(() => { mainEl.classList.add('show'); }, 100);
      setTimeout(() => { loaderEl.style.display = 'none'; }, 700);
    }
  }

  async function load() {
    if (!firstLoad) {
      contentEl.classList.add('fade');
      infoEl.classList.add('fade');
    }
    try {
      const d = await fetchPoem();
      const delay = firstLoad ? 500 : 200;
      setTimeout(() => render(d), delay);
    } catch (e) {
      contentEl.innerText = '加载失败，请刷新';
      infoEl.innerText = '';
      if (firstLoad) {
        firstLoad = false;
        loaderEl.classList.add('hide');
        mainEl.classList.add('show');
      }
    }
  }

  toggleBtn.onclick = function() {
    if (!fullLines.length) return;
    fullEl.classList.toggle('show');
    toggleBtn.innerText = fullEl.classList.contains('show') ? '收起' : '显示全文';
  };

  copyBtn.onclick = async function() {
    if (!currentContent) return;
    const text = `${currentContent}—————${currentInfo}`;
    try {
      await navigator.clipboard.writeText(text);
      showToast('已复制');
    } catch (e) {
      // 旧浏览器或非 HTTPS 环境回退方案
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('已复制');
      } catch (err) {
        showToast('复制失败，请长按选择');
      }
      document.body.removeChild(ta);
    }
  };

  let toastTimer = null;
  function showToast(msg) {
    toastEl.innerText = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
  }

  refreshBtn.onclick = function() {
    refreshBtn.disabled = true;
    load();
    setTimeout(() => refreshBtn.disabled = false, 600);
  };

  load();
</script>
</body>
</html>
